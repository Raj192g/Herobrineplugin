name: Build Herobrine Paper plugin

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Extract plugin source
        run: unzip -q HerobrinePaperPlugin-build-ready-source.zip

      - name: Build plugin
        run: cd HerobrinePaperPlugin && mvn --batch-mode clean package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: HerobrinePaper-plugin
          path: HerobrinePaperPlugin/target/*.jar
          if-no-files-found: error
